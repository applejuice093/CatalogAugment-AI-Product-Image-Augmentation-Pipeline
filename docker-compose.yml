services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: catalogaugment-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: catalogaugment
      POSTGRES_PASSWORD: catalogaugment
      POSTGRES_DB: catalogaugment
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalogaugment -d catalogaugment"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: catalogaugment-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
